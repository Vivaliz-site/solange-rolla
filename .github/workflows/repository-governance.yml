name: Repository Governance Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  governance-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-rolla-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate superseded-repository containment
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'REPOSITÓRIO HISTÓRICO / SUPERSEDIDO' README.md
          grep -Fq 'Vivaliz-site/solange-rolla-consultorio' README.md

          for workflow in .github/workflows/ci.yml .github/workflows/repository-governance.yml; do
            grep -Fq "github.event.pull_request.head.repo.full_name == github.repository" "$workflow"
            if grep -Eq '^[[:space:]]*push:' "$workflow"; then
              echo "automatic push trigger is forbidden on superseded repo: $workflow" >&2
              exit 1
            fi
          done

          python3 -c 'import json, os, sys; sys.exit(0 if json.load(open("docs/quality/AUDIT_PROJECT_REQUIREMENTS.json"))["project"] == os.environ["GITHUB_REPOSITORY"] else 31)'
          echo LEGACY_SOLANGE_CONTAINMENT=PASS

      - name: Validate absolute audit V5 governance bridge
        shell: bash
        run: bash scripts/repository-governance-validate.sh ci
